[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-multi-agent-support"
version = "0.1.0"
description = "Multi-agent customer support on Google ADK, with guardrails, human-in-the-loop approval and an evaluation suite."
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["support_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
